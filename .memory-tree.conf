# .memory-tree.conf — per-repo config for the memory-tree hygiene kit (swydee).
# Sourced by every kit script. Plain shell assignments only. Pinned to LF in .gitattributes:
# this file is sourced by bash, and a trailing CR would make MEMORY_ROOT literally "memory<CR>".

MEMORY_ROOT=memory

# Disciplines = swydee's actual streams, matching the kickoff manifest's pointer map.
#   extraction    — Swydo API/JWT/GraphQL/WS pull, period resolution   (Get-SwydoReport)
#   analysis      — single-report facts, canonical totals, reconciliation, data-gap rules,
#                   and the closer contract                            (Analyze-SwydoReport, Test-ReportNumbers)
#   trend         — ledger, trend facts, client canonicalization, archive/registry
#                                                                      (Sync/ConvertTo/Update/Analyze-SwydoTrend, Manage-SwydoArchive)
#   orchestration — SKILL.md invocation modes + report voice/template surface
# NOT named "archive": hygiene checks 1 and 2 both exclude any path matching /archive/, so a
# discipline by that name would silently exempt its whole subtree from two checks.
DISCIPLINES="extraction analysis trend orchestration"

# discipline:FAMILY. MUST stay byte-identical to {{ID_FAMILIES}} as filled in AGENTS.md §6 —
# memory-recall keys its index digest on FAMILIES, so a drift silently changes what the corpus
# can answer, and `adopt-memory-recall.sh --check` is the leg that catches it.
FAMILIES="extraction:EXTR analysis:ANLZ trend:TREND orchestration:ORCH"

# The ratified spec corpus moved out of docs/specs/ into the tree at adoption; check 11 keeps it
# from being resurrected there. Scoped to docs/specs, never to a bare docs. swydee has no docs/
# directory at all: the live kickoff manifest is .claude/SESSION-KICKOFF.md.
TOMBSTONE_ROOTS="docs/specs"

# Spec-format ratchet (check 12). Every spec whose FILENAME date is >= this must follow
# memory/TEMPLATE-SPEC.md. The six migrated specs are dated 2026-07-07 and 2026-07-13, so they are
# grandfathered by filename date and are NOT retrofitted — they are ratified records.
SPEC_FORMAT_CUTOFF="2026-08-04"
